<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="245" viewBox="0 0 1100 245" role="img" aria-label="Al Mahfouz Law Firm — live law firm website with a role-based admin dashboard">
<style>
@keyframes pulse{0%,100%{opacity:.38}50%{opacity:.9}}
@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes sweep{0%{transform:translateX(-500px)}100%{transform:translateX(1450px)}}
@keyframes live{0%,100%{opacity:1}50%{opacity:.25}}
.pulse{animation:pulse 3.5s ease-in-out infinite}.float{animation:rise 5s ease-in-out infinite}.sweep{animation:sweep 8s linear infinite}.live{animation:live 1.6s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081526"/><stop offset=".6" stop-color="#10283b"/><stop offset="1" stop-color="#0b1731"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#25dfb8"/><stop offset="1" stop-color="#4bd3ff"/></linearGradient>
<pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#84cde3" opacity=".12"/></pattern>
<clipPath id="clip"><rect width="1100" height="245" rx="18"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="1100" height="245" rx="18" fill="url(#bg)"/><rect width="1100" height="245" fill="url(#grid)"/>
<circle class="pulse" cx="1010" cy="5" r="190" fill="#1eafba" opacity=".12"/>
<path d="M0 208H1100" stroke="#39748d" stroke-opacity=".25"/>
<rect x="34" y="28" width="168" height="25" rx="12" fill="#12404d" stroke="#208c8c"/>
<circle class="live" cx="49" cy="40" r="4" fill="#3be2bf"/>
<text x="62" y="44" fill="#5ce9cc" font-family="Consolas,monospace" font-size="11" letter-spacing="1.4">LIVE CLIENT SITE</text>
<rect x="214" y="28" width="74" height="25" rx="12" fill="none" stroke="#326278"/>
<text x="251" y="44" fill="#8fb4c8" font-family="Consolas,monospace" font-size="11" letter-spacing="1.4" text-anchor="middle">LATEST</text>
<text x="35" y="104" fill="#f2f8ff" font-family="Arial,sans-serif" font-size="39" font-weight="800">AL MAHFOUZ LAW FIRM</text>
<text x="37" y="137" fill="#a8c1d5" font-family="Arial,sans-serif" font-size="18">Firm website · Contact requests · Admin dashboard · Roles &amp; permissions</text>
<text x="37" y="183" fill="#4cdbed" font-family="Consolas,monospace" font-size="14">PHP 8 MVC  /  MYSQL  /  BOOTSTRAP 5  /  CPANEL</text>
<g class="float" transform="translate(770 30)">
<rect x="0" y="0" width="290" height="177" rx="14" fill="#081522" stroke="#32617b"/>
<path d="M0 33H290" stroke="#32617b"/><circle cx="18" cy="17" r="4" fill="#ef7980"/><circle cx="34" cy="17" r="4" fill="#ffc86c"/><circle cx="50" cy="17" r="4" fill="#39dcb7"/>
<text x="17" y="58" fill="#d9e9f5" font-family="Consolas,monospace" font-size="13">REQUESTS / STATUS</text>
<g font-family="Arial,sans-serif" font-size="12" fill="#c1d8e6">
<text x="17" y="85">Consultation</text><text x="17" y="111">Contract review</text><text x="17" y="137">Labour case</text>
</g>
<g font-family="Consolas,monospace" font-size="10" font-weight="700" text-anchor="middle">
<rect x="168" y="73" width="96" height="17" rx="8" fill="#3a3216" stroke="#ffc86c" stroke-opacity=".6"/><text x="216" y="85" fill="#ffd27f">PENDING</text>
<rect x="168" y="99" width="96" height="17" rx="8" fill="#12334a" stroke="#4bd3ff" stroke-opacity=".6"/><text x="216" y="111" fill="#7fdcff">IN REVIEW</text>
<rect x="168" y="125" width="96" height="17" rx="8" fill="#12404d" stroke="#3be2bf" stroke-opacity=".6"/><text x="216" y="137" fill="#5ce9cc">HANDLED</text>
</g>
<text x="17" y="163" fill="#54e3c6" font-family="Consolas,monospace" font-size="11">SUPER ADMIN  /  REPLY BY EMAIL</text>
</g>
<rect class="sweep" x="-500" y="0" width="190" height="245" fill="#6af3dc" opacity=".045" transform="skewX(-18)"/>
</g></svg>
