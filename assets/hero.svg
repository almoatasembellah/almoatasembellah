<style>
@keyframes glow{0%,100%{opacity:.25}50%{opacity:.5}}@keyframes blink{50%{opacity:0}}@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes reveal{0%,16%{opacity:0}20%,100%{opacity:1}}
.orb{animation:glow 5s ease-in-out infinite}.cursor{animation:blink 1.05s step-end infinite}.win{animation:drift 6s ease-in-out infinite}.line{animation:pulse 5s ease-in-out infinite}.l1{animation:reveal 7s linear infinite}.l2{animation:reveal 7s -1.4s linear infinite}.l3{animation:reveal 7s -2.8s linear infinite}
</style>
